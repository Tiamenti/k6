name: Stress Test (k6)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL сайта для тестирования'
        required: true
        type: string
      http_method:
        description: 'HTTP метод'
        required: false
        default: 'GET'
        type: choice
        options:
          - GET
          - POST
      load_mode:
        description: 'Тип нагрузки: по числу пользователей или по RPS'
        required: true
        type: choice
        options:
          - vus
          - rps
      load_value:
        description: 'Значение: кол-во VUs (если vus) ИЛИ запросов/сек (если rps)'
        required: true
        default: '50'
        type: string
      duration:
        description: 'Длительность основной фазы теста (например, 1m, 5m)'
        required: false
        default: '1m'
        type: string
      max_vus:
        description: '[только для rps] Максимум VUs, которые k6 может создать для достижения RPS'
        required: false
        default: '200'
        type: string

jobs:
  stress-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate k6 test script
        run: |
          mkdir -p tests
          cat << 'EOF' > tests/stress-test.js
          import http from 'k6/http';
          import { check, sleep } from 'k6';

          const TARGET_URL = __ENV.TARGET_URL;
          const METHOD = __ENV.HTTP_METHOD || 'GET';
          const LOAD_MODE = __ENV.LOAD_MODE;
          const DURATION = __ENV.DURATION;

          let scenario;

          if (LOAD_MODE === 'rps') {
            scenario = {
              executor: 'constant-arrival-rate',
              rate: Number(__ENV.LOAD_VALUE),
              timeUnit: '1s',
              duration: DURATION,
              preAllocatedVUs: 20,
              maxVUs: Number(__ENV.MAX_VUS),
            };
          } else {
            scenario = {
              executor: 'constant-vus',
              vus: Number(__ENV.LOAD_VALUE),
              duration: DURATION,
            };
          }

          export const options = {
            scenarios: { stress: scenario },
          };

          export default function () {
            const res = http.request(METHOD, TARGET_URL);
            check(res, {
              'status is 2xx-3xx': (r) => r.status >= 200 && r.status < 400,
            });

            if (LOAD_MODE !== 'rps') {
              sleep(1);
            }
          }
          EOF

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 stress test
        uses: grafana/run-k6-action@v1
        with:
          path: |
            tests/stress-test.js
          flags: >-
            --env TARGET_URL=${{ inputs.target_url }}
            --env HTTP_METHOD=${{ inputs.http_method }}
            --env LOAD_MODE=${{ inputs.load_mode }}
            --env LOAD_VALUE=${{ inputs.load_value }}
            --env DURATION=${{ inputs.duration }}
            --env MAX_VUS=${{ inputs.max_vus }}
          inspect-flags: >-
            --env TARGET_URL=${{ inputs.target_url }}
            --env HTTP_METHOD=${{ inputs.http_method }}
            --env LOAD_MODE=${{ inputs.load_mode }}
            --env LOAD_VALUE=${{ inputs.load_value }}
            --env DURATION=${{ inputs.duration }}
            --env MAX_VUS=${{ inputs.max_vus }}
