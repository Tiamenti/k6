name: Stress Test (k6)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL сайта для тестирования (например, https://example.com)'
        required: true
        type: string
      virtual_users:
        description: 'Количество виртуальных пользователей (VUs)'
        required: false
        default: '50'
        type: string
      duration:
        description: 'Длительность теста (например, 30s, 1m, 5m)'
        required: false
        default: '1m'
        type: string
      http_method:
        description: 'HTTP метод'
        required: false
        default: 'GET'
        type: choice
        options:
          - GET
          - POST

jobs:
  stress-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate k6 test script
        run: |
          mkdir -p tests
          cat << 'EOF' > tests/stress-test.js
          import http from 'k6/http';
          import { check, sleep } from 'k6';

          const TARGET_URL = __ENV.TARGET_URL;
          const METHOD = __ENV.HTTP_METHOD || 'GET';

          export default function () {
            const res = http.request(METHOD, TARGET_URL);
            check(res, {
              'status is 2xx-3xx': (r) => r.status >= 200 && r.status < 400,
            });
            sleep(1);
          }
          EOF

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 stress test
        uses: grafana/run-k6-action@v1
        env:
          TARGET_URL: ${{ inputs.target_url }}
          HTTP_METHOD: ${{ inputs.http_method }}
        with:
          path: |
            tests/stress-test.js
          flags: --vus ${{ inputs.virtual_users }} --duration ${{ inputs.duration }}
